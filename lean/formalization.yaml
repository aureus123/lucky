      - "Marcelo Mydlarz"
      - name: "Daniel E. Severín"
        orcid: "0000-0003-2391-3489"
    id: "doi:10.1016/j.ipl.2014.09.011"
    type: "article"
    location: "Inf. Process. Lett. 115 (2015) 199-202; Propositions 1 and 3"
    relationship: "formalizes"
    note: >-
      The paper cites Proposition 3 as its Lemma 2 and Proposition 1 as its Lemma 3; both are
      proved here, following this article.
    author_endorsement: "participated"
  - title: "Lucky labelings of graphs"
    authors:
      - "Sebastian Czerwiński"
      - "Jarosław Grytczuk"
      - "Wiktor Żelazny"
    id: "doi:10.1016/j.ipl.2009.05.011"
    type: "article"
    location: "Inf. Process. Lett. 109 (2009) 1078-1081"
    relationship: "background"
    note: >-
      Defines the additive chromatic number and states the Additive Coloring Conjecture
      η(G) ≤ χ(G). Its bound for trees, which the paper uses for paths, is not used: η(P_N) = 2
      is proved with an explicit labeling.
    author_endorsement: "n/a"

