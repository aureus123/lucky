status:
  scope: >-
    A formalization of Sections 1-5 of the paper, with the proofs of Propositions 1-5 from the
    appendix of the arXiv version, and of the two results of ref. [6] that the paper cites
    (Lemmas 2 and 3). Every result is unconditional; the facts that the paper takes from the
    literature or uses without proof are also proved: η(G) = min η_t(D), η(P_N) = 2, η(K_n) = n,
    χ(G ∨ K_q) ≥ χ(G) + q, and the existence of an additive coloring of every graph. Not
    formalized: Section 6 and Appendix B (the integer programming model, the computational
    experiments on graphs with up to 10 vertices, and closed additive colorings).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - declaration: "SimpleGraph.theorem_1"
      file: "ACN/Sec2.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "SimpleGraph.theorem_2"
      file: "ACN/Sec3.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "SimpleGraph.IsSplitWith.theorem_3"
      file: "ACN/Sec4.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "SimpleGraph.proposition_4"
      file: "ACN/Sec4Sun.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "SimpleGraph.split_graph_conjecture"
