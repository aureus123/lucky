automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code agent working in the local repository, building with lake and the pinned
        Mathlib, porting the existing Isabelle/HOL formalization of the same results under the
        author's direction. The arithmetic of the labelings is decided by the project's tactics
        split_omega and mod_split (built on omega); the rest uses Mathlib's simp, omega and
        Finset lemmas.
      cost:
        wall_time: "one working session (2026-10-22)"
        spend_usd: "not tracked"
        hardware: "API-only models; builds on a local Mac"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The Lean development was written by Claude Code under the direction of the paper's author,
    following the Isabelle/HOL formalization of the same results (also written by Claude Code
    under the author's direction). The statements were stated anew over Mathlib's SimpleGraph.

fidelity:
  divergences: >-
    Graphs are Mathlib SimpleGraphs on finite types, and χ(G) is Mathlib's chromaticNumber. The
    families are concrete graphs (paths and cycles are Mathlib's pathGraph and cycleGraph), so
    each proposition is stated for a specific graph; the paper states them up to isomorphism.
    In the proof of Theorem 1, the step "i ≥ j" is false (e.g. part sizes (3, 1) ordered as
    (1, 3)), and so is the inequality s'_j ≥ s_i that it is used for. The lower bound is proved
    by a different argument (mpBound_sorted_le); η(G) ≤ r is proved from the closed form of s_i.
    Theorem 3 is stated without the hypothesis T ≠ ∅, which the proof does not need; the
    hypothesis is harmless, since T = ∅ only gives η(G) ≤ |Q| + 1, weaker than the bound |Q|
    obtained from T = {u}, u ∈ Q. In the
    appendix's proof of Proposition 4, case m ≡ 2 (mod 6), i = ⌊m/2⌋ + 1, the paper writes
    r = m/3 + 1 and f(v_{i-1}) = 1; in fact r = (m + 4)/3 and f(v_{i-1}) = 2, and the claimed
    recurrence still holds (ks_claim). The lower bound of Proposition 1 obtains the paper's
    "oriented path of 3 consecutive vertices" by a parity argument.

review:
  status: "unchecked"
  reviewers: []
  notes: >-
    The development builds without sorry and its main theorems depend only on propext,
    Classical.choice and Quot.sound. The statements follow the Isabelle/HOL formalization of the
    same results. No statement-by-statement audit against the paper has been done yet.

alignment:
  namespace: "SimpleGraph"
  statements:
    - source: "Section 1: η(G) = min η_t(D) over acyclic orientations"
      lean: "SimpleGraph.eta_eq_iInf_etaT"
      module: "ACN.Basics"
      status: "proved"
    - source: "Observation 1, Lemma 1, Corollary 1"
      lean: "SimpleGraph.observation_1, SimpleGraph.lemma_1, SimpleGraph.corollary_1"
      module: "ACN.Sec2"
      status: "proved"
    - source: "Lemma 2 (ref. [6], Prop. 3)"
      lean: "SimpleGraph.lemma_2_value, SimpleGraph.lemma_2_finite_iff"
      module: "ACN.Sec2"
      status: "proved"
    - source: "Theorem 1 and the conjecture for complete multipartite graphs"
      lean: "SimpleGraph.theorem_1, SimpleGraph.theorem_1_conjecture"
      module: "ACN.Sec2"
      status: "proved"
      note: "The lower bound uses a corrected argument (mpBound_sorted_le)."
    - source: "Observation 2, Theorem 2 and the conjecture for G ∨ K_q"
      lean: "SimpleGraph.observation_2, SimpleGraph.theorem_2, SimpleGraph.chromaticNumber_joinK, SimpleGraph.theorem_2_conjecture"
      module: "ACN.Sec3"
      status: "proved"
    - source: "Section 3: fans, windmills, wheels; Proposition 1 (odd cycles)"
      lean: "SimpleGraph.fan, SimpleGraph.windmill, SimpleGraph.wheel, SimpleGraph.proposition_1"
      module: "ACN.Sec3Families"
      status: "proved"
    - source: "Theorem 3 and the conjecture for split graphs; Proposition 2"
      lean: "SimpleGraph.IsSplitWith.theorem_3, SimpleGraph.split_graph_conjecture, SimpleGraph.proposition_2"
      module: "ACN.Sec4"
      status: "proved"
      note: "Theorem 3 without the hypothesis T ≠ ∅, which is not needed but harmless (T = ∅ only gives |Q| + 1)."
    - source: "Lemma 3 (ref. [6], Prop. 1) and Corollary 2"
      lean: "SimpleGraph.lemma_3, SimpleGraph.corollary_2"
      module: "ACN.Sec4"
      status: "proved"
    - source: "Proposition 3 (thin and thick headless spiders)"
      lean: "SimpleGraph.proposition_3_thin, SimpleGraph.proposition_3_thick"
      module: "ACN.Sec4Spiders"
      status: "proved"
    - source: "Proposition 4 (complete suns)"
      lean: "SimpleGraph.proposition_4"
      module: "ACN.Sec4Sun"
      status: "proved"
    - source: "Proposition 5 (cycle suns and wheel suns)"
      lean: "SimpleGraph.proposition_5_cycle, SimpleGraph.proposition_5_wheel"
      module: "ACN.Sec5"
      status: "proved"

