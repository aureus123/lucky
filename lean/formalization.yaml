    authors:
      - name: "Daniel E. Severín"
        orcid: "0000-0003-2391-3489"
    id: "doi:10.1016/j.ipl.2020.105937"
    type: "article"
    location: >-
      Inf. Process. Lett. 158 (2020) 105937 (arXiv:1602.07675, whose appendix contains the
      proofs of Propositions 1-5); Sections 1-5 and Appendix A
    relationship: "formalizes"
    note: >-
      Sections 1-5 and the proofs of Propositions 1-5 are formalized. The lower bound of
      Theorem 1 is proved by a different argument, because a step of the paper's proof is
      false (see fidelity); the theorem itself is correct.
    author_endorsement: "participated"
  - title: "Topological additive numbering of directed acyclic graphs"
    authors:
