# in the shape expected by the Palomar Registry (https://palomar-registry.org/how-to-submit).
# It describes the Lean 4 formalization in this folder; the Isabelle/HOL and Mizar formalizations
# of the repository are listed under related_formalizations.
version: "v0.4"

project:
  name: "On the additive chromatic number of several families of graphs (Lean 4)"
  description: >-
    Lean 4 + Mathlib formalization of Sections 1-5 of D. Severín, "On the additive chromatic
    number of several families of graphs" (Inf. Process. Lett. 158, 2020), with the proofs of
    Propositions 1-5 from the appendix of the arXiv version. The additive chromatic number η(G)
    is the least k with a labeling f : V → [k] such that the sums f(N(u)) and f(N(v)) differ
    for every edge uv. It proves η(G) = min η_t(D) over acyclic orientations; Observation 1,
    Lemma 1 and Corollary 1 (bipartite graphs); Lemma 2 and Theorem 1, the value of η for
    complete multipartite graphs; Observation 2 and Theorem 2, η(G ∨ K_q) = max {η(G), q};
    fans, windmills, wheels and odd cycles (Proposition 1); Theorem 3 and Proposition 2 (split
    graphs); Lemma 3 and Corollary 2 (a lower bound from cliques); headless spiders
    (Proposition 3), complete suns (Proposition 4), and cycle and wheel suns (Proposition 5).
    It also proves the Additive Coloring Conjecture η(G) ≤ χ(G) for complete multipartite
    graphs, for joins G ∨ K_q of graphs that satisfy it, and for split graphs.
  authors:
    - name: "Daniel E. Severín"
      orcid: "0000-0003-2391-3489"
  license: "MIT"
  responsible_maintainers:
    - name: "Daniel E. Severín"
      orcid: "0000-0003-2391-3489"

classification:
  arxiv: ["math.CO", "cs.DM"]
  msc2020: ["05C15", "05C78", "68V20"]

sources:
